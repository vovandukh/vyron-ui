name: Deploy demo to GitHub Pages

# Збирає демо-версію (npm run build:demo — одразу демо-режим) і публікує її в окремий
# публічний репозиторій, з якого GitHub Pages віддає сайт.
#
# Одноразове налаштування:
#   1. Публічний репозиторій для демо (за замовчуванням vovandukh/vyron-demo; інший — змінна DEMO_REPO
#      у Settings → Secrets and variables → Actions → Variables).
#   2. Fine-grained токен з доступом лише до цього репозиторію, Contents: Read and write →
#      секрет DEMO_DEPLOY_TOKEN у цьому репозиторії.
#   3. У демо-репозиторії: Settings → Pages → Deploy from a branch → main / (root).
# Без секрету workflow падає (у форках — тихо пропускає деплой).

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/screen/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DEMO_REPO: ${{ vars.DEMO_REPO || 'vovandukh/vyron-demo' }}
      TOKEN: ${{ secrets.DEMO_DEPLOY_TOKEN }}
    steps:
      - name: Check deploy token
        id: tok
        run: |
          if [ -z "$TOKEN" ] && [ "$GITHUB_REPOSITORY" = "vovandukh/vyron-ecosystem" ]; then
            echo "::error::DEMO_DEPLOY_TOKEN is not set — the demo was NOT published (see the setup notes at the top of this file)"; exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::notice::no DEMO_DEPLOY_TOKEN in this fork — demo deploy skipped"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.tok.outputs.skip != '1'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.tok.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build demo
        if: steps.tok.outputs.skip != '1'
        run: |
          npm ci
          npm run build:demo
          npm run build:screen:demo
          if grep -qE '(src|href)="\./assets/' apps/web/dist-demo/index.html; then
            echo "apps/web/dist-demo/index.html references ./assets/ — single-file build is broken"; exit 1
          fi

      - name: Publish to demo repository
        if: steps.tok.outputs.skip != '1'
        run: |
          # Сайту історія не потрібна: щоразу один коміт від бота, що замінює все (force-push).
          # Так у публічному репозиторії демо немає нічого, крім поточної збірки.
          mkdir site && cd site
          git init -q -b main
          cp ../apps/web/dist-demo/index.html index.html
          # Vyron Screen у демо-режимі й сторінки пристроїв (меню «Екрани принтера»)
          cp ../apps/screen/dist-demo/index.html screen.html
          mkdir -p screens && cp ../apps/screen/demo/*.html screens/
          touch .nojekyll
          printf '# Vyron — demo\n\nAuto-generated demo build of Vyron Web and Vyron Screen (Vue 3, single-file).\nDo not edit: every push to the source repository overwrites this content.\n' > README.md
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "deploy demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${DEMO_REPO}.git" HEAD:main
