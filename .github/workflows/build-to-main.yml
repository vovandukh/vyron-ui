name: Build to main

# Збирає Vue-застосунок і кладе готову статику (index.html, assets/) у корінь main,
# звідки її забирають nginx на принтері та Moonraker Update Manager.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-to-main
  cancel-in-progress: true

jobs:
  build:
    # Захист від циклу: не реагуємо на власні коміти бота.
    # (Пуші через GITHUB_TOKEN і так не запускають workflow, а [skip ci] — додатковий запобіжник.)
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build is a single file
        run: |
          # vite-plugin-singlefile вшиває JS/CSS/картинки в index.html. Nginx на принтері
          # віддає лише HTML-файл, тож будь-яке посилання на ./assets/ дасть білий екран.
          if grep -qE '(src|href)="\./assets/' dist/index.html; then
            echo "dist/index.html still references ./assets/ — single-file build is broken"
            exit 1
          fi

      - name: Copy build to repository root
        run: |
          # Збірка — один автономний HTML; тека assets/ у корені більше не потрібна.
          rm -rf assets
          cp dist/index.html index.html
          cp dist/index.html voron.html
          # Стара адреса однофайлового інтерфейсу веде на той самий застосунок.
          cp dist/index.html voron_2_4_six_tool_ui.html

      - name: Commit and push build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html voron.html voron_2_4_six_tool_ui.html
          # Прибрати старі бандли з репозиторію; --ignore-unmatch — щоб крок не падав, коли assets/ вже немає.
          git rm -r -q --cached --ignore-unmatch assets
          if git diff --cached --quiet; then
            echo "Build output unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore: build production assets [skip ci]"
          # Якщо за час збірки в main з'явились нові коміти — підтягуємо їх і пушимо ще раз.
          git pull --rebase origin main
          git push origin HEAD:main
