# Vyron Screen — локальний сайт nginx лише для екрана принтера. Створює install/screen.sh.
# Слухає тільки 127.0.0.1 (з мережі недоступний), Mainsail і сайт vyron не чіпає.

map $http_upgrade $vyron_screen_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:@PORT@;
    server_name _;
    root @ROOT@;

    # Vyron Screen або (install.sh --gpu --screen-app web) повний Vyron Web — обидва без кешу,
    # щоб після оновлення одразу бралась нова версія
    location = /screen.html {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location / {
        return 302 @HOME@;
    }

    location /websocket {
        proxy_pass http://127.0.0.1:@MOONRAKER_PORT@/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vyron_screen_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400;
    }

    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://127.0.0.1:@MOONRAKER_PORT@$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 600;
    }
}
