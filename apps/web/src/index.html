<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<script>
// Тихе оновлення (shared/live.js): браузер робить View Transition зі старої сторінки на цю. Знімок старої
// тримаємо (анімації на паузі), доки застосунок не підключиться й не покаже дані — revealReady(); не довше 4 с.
addEventListener('pagereveal', function (e) {
  var vt = e.viewTransition
  if (!vt) return
  var done = false
  function play() { if (done) return; done = true; document.getAnimations().forEach(function (a) { a.play() }) }
  window.__vyronPlay = play
  vt.ready.then(function () {
    if (window.__vyronReady) return
    document.getAnimations().forEach(function (a) { a.pause() })
    setTimeout(play, 4000)
  }).catch(function () {})
})
</script>
<title>Vyron</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;500;600&display=swap">
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
