ити не потрібно.","klippy.offline.t":"Програма керування принтером не працює","klippy.offline.d":"Вебінтерфейс на зв’язку, але Klipper — програма, яка безпосередньо керує принтером, — зупинена або аварійно завершилась.","klippy.offline.h":`Натисни «Перезапустити службу» — найчастіше цього достатньо

Натисни «Перезапустити принтер», щоб повернути його в роботу
Перерваний друк доведеться почати заново`,"kerr.mcuLost.t":"Втрачено зв’язок з платою «{mcu}»","kerr.mcuLost.d":"Плата керування перестала відповідати, і принтер зупинився заради безпеки. Найчастіше винні кабель або живлення.","kerr.mcuLost.h":`Перевір кабель плати (USB або CAN) і роз’єми з обох боків — чи не відійшли
Оглянь кабель до голови: він постійно згинається і може перетертися
Переконайся, що плата має живлення — на ній зазвичай світиться світлодіод
Потім натисни «Перезапустити принтер»`,"kerr.mcuConnect.t":"Не вдається підключитися до плати «{mcu}»","kerr.mcuConnect.d":"Під час запуску Klipper не знайшов плату. Можливо, вона вимкнена, не прошита або в налаштуваннях вказана не та адреса.","kerr.mcuConnect.h":`Переконайся, що плата увімкнена і кабель підключено
Перевір адресу плати в printer.cfg: serial для USB або canbus_uuid для CAN
Для CAN: шина can0 має бути увімкнена (ip link show can0), а її швидкість — однакова на хості й у прошивці плати
Якщо CAN-шину щойно зібрали: на її кінцях потрібен резистор 120 Ом — зазвичай це перемичка на платі`,"kerr.mcuProtocol.t":"Прошивка плати «{mcu}» застаріла","kerr.mcuProtocol.d":"Програма на платі не відповідає версії Klipper на комп’ютері принтера. Майже завжди так буває після оновлення Klipper.","kerr.mcuProtocol.h":`Перепроший плату — прошивку треба зібрати з тієї ж версії Klipper, що встановлена на хості
Якщо плат кілька, оновити потрібно всі`,"kerr.timer.t":"Плата «{mcu}» не встигла вчасно","kerr.timer.d":"Плата отримала команду запізно або не встигла її виконати і зупинилась, щоб не зіпсувати рух. Зазвичай причина — перевантажений комп’ютер принтера чи нестабільний зв’язок.","kerr.timer.h":`Подивись навантаження процесора й пам’яті в Інженерному меню
Закрий зайве на хості: другий вебінтерфейс, камеру з високою роздільністю
Перевір кабель до плати і чи не перегрівається хост
Якщо збій буває на високих швидкостях — плата може не встигати: зменш мікрокроки (microsteps) або швидкість
Потім натисни «Перезапустити принтер»`,"kerr.heaterRate.t":"Нагрівач «{heater}» гріється надто повільно","kerr.heaterRate.d":"Температура росла повільніше, ніж очікувалось, тому принтер вимкнув нагрів. Це захист від перегріву й пожежі.","kerr.heaterRate.h":`Перевір, чи датчик температури (термістор) щільно сидить у нагрівальному блоці
Оглянь дроти нагрівача — чи немає обриву чи поганого контакту
Якщо обдув моделі дуже сильний, зменш його на час нагріву
Після ремонту варто провести PID-калібрування`,"kerr.adc.t":"Температура вийшла за допустимі межі","kerr.adc.d":"Датчик показав температуру, нижчу за мінімум або вищу за максимум із конфігурації, і принтер вимкнув нагрів. Найчастіше це обрив чи замикання дроту датчика, рідше — справжній перегрів.","kerr.adc.h":`Оглянь дроти термістора — чи немає обриву, перетирання чи замикання
Перевір, чи роз’єм датчика щільно вставлений у плату
Якщо друкуєш при високій температурі — перевір, чи не занизький max_temp у printer.cfg
Якщо датчик щойно міняли — перевір sensor_type у printer.cfg`,"kerr.tmc.t":"Проблема з драйвером мотора {drv}","kerr.tmc.d":"Плата не може зв’язатися з драйвером, який керує мотором, або драйвер повідомив про збій. Без нього рух небезпечний.","kerr.tmc.h":`Переконайся, що живлення моторів увімкнене і запобіжник цілий
Перевір кабель мотора — замикання в ньому теж викликає цю помилку
Перевір, чи щільно сидить драйвер на платі
Якщо драйвер гарячий — перевір охолодження електроніки`,"kerr.notHomed.t":"Спершу потрібно знайти нуль осей","kerr.notHomed.d":"Принтер не знає, де зараз голова, тому не може рухатися за координатами.","kerr.notHomed.h":"Натисни Home (будиночок) на панелі руху — принтер сам визначить положення осей","kerr.range.t":"Точка поза робочою зоною","kerr.range.d":"Команда вимагала виїхати за межі столу, тому принтер її не виконав. Нічого не пошкоджено.","kerr.range.h":`Якщо це сталося під час друку — перевір у слайсері, чи модель повністю на столі
Якщо задавали зсув координат вручну (G92, SET_GCODE_OFFSET) — скинь його`,"kerr.cold.t":"Сопло ще не нагріте","kerr.cold.d":"Klipper не дає подавати пластик, поки сопло холодніше за поріг (за замовчуванням 170 °C): пластик не розплавиться і застрягне. Команду пропущено.","kerr.cold.h":"Нагрій сопло до робочої температури пластику (PLA — близько 200 °C, PETG — 240 °C, ABS — 250 °C) і повтори дію","kerr.extLong.t":"Задовга подача пластику за раз","kerr.extLong.d":"Klipper обмежує, скільки пластику можна подати однією командою (за замовчуванням 50 мм), щоб помилкова команда не видавила зайвого.","kerr.extLong.h":`Подавай пластик кількома коротшими порціями
Якщо довга подача потрібна навмисно — збільш max_extrude_only_distance у printer.cfg`,"kerr.endstopStuck.t":"Кінцевик осі {axis} не відпускається","kerr.endstopStuck.d":"Вісь відійшла від кінцевика, а він досі показує натискання. Вимикач міг залипнути, кабель — замкнутися, або сигнал інвертовано в конфігурації.","kerr.endstopStuck.h":`Перевір, чи вимикач вільно клацає і нічим не притиснутий
Стан кінцевиків покаже команда QUERY_ENDSTOPS у консолі
Якщо кінцевик завжди «натиснутий» — у printer.cfg, можливо, треба додати або прибрати «!» перед піном
Для sensorless homing — зменш чутливість (driver_SGTHRS)`,"kerr.endstop.t":"Кінцевик осі {axis} не спрацював","kerr.endstop.d":"Під час пошуку нуля вісь проїхала весь шлях, але кінцевий вимикач так і не подав сигнал, тож принтер зупинив рух.","kerr.endstop.h":`Перевір, чи підключений кабель кінцевика і чи він цілий
Стан кінцевиків покаже команда QUERY_ENDSTOPS у консолі
Для sensorless homing — можливо, треба збільшити чутливість (driver_SGTHRS)`,"kerr.probePre.t":"Датчик столу спрацював зарано","kerr.probePre.d":"Датчик повідомив про дотик ще до того, як почав опускатися: він уже торкається столу або подає хибний сигнал.","kerr.probePre.h":`Переконайся, що сопло й датчик не торкаються столу і під ними нічого немає
Перевір кабель датчика; стан покаже команда QUERY_PROBE
Для датчика Eddy — повтори калібрування`,"kerr.probeNone.t":"Датчик столу не відчув стіл","kerr.probeNone.d":"Голова опустилася до кінця, а датчик так і не спрацював. Принтер зупинився, щоб сопло не вдарилось у стіл.","kerr.probeNone.h":`Перевір, чи датчик реагує: команда QUERY_PROBE у консолі покаже його стан
Перевір, чи підключений кабель датчика і чи він цілий
Якщо датчик справний — вісь Z може не опускатися достатньо: перевір position_min у [stepper_z]`,"kerr.probeTol.t":"Датчик столу міряє нестабільно","kerr.probeTol.d":"Кілька замірів в одній точці помітно відрізняються, тому результату не можна довіряти.","kerr.probeTol.h":`Очисти сопло й стіл від залишків пластику
Перевір, чи надійно закріплений датчик — люфт дає розкид
Точність датчика покаже команда PROBE_ACCURACY`,"kerr.leveling.t":"Не вдалося вирівняти портал","kerr.leveling.d":"Принтер кілька разів пробував вирівняти портал, але перекіс так і не зменшився до потрібної точності.","kerr.leveling.h":`Якщо портал сильно перекошений — спершу вирівняй його вручну
Перевір точність датчика командою PROBE_ACCURACY
За потреби збільш кількість спроб (retries) у printer.cfg`,"kerr.config.t":"Помилка в конфігурації принтера","kerr.config.d":"Klipper не зміг прочитати printer.cfg, тому принтер не запустився. У технічних деталях вказано, де саме помилка.","kerr.config.h":`Натисни «Відкрити конфігурацію» і знайди розділ та параметр, названі в технічних деталях
Виправ, збережи файл і натисни «Перечитати конфігурацію»`,"kerr.macro.t":"Помилка в макросі {macro}","kerr.macro.d":"Макрос — це набір команд із налаштувань принтера. Під час його виконання сталася помилка, і він не завершився.","kerr.macro.h":`Перевір, чи передано макросу всі потрібні параметри

ustom","design.g.glass":"Glass","design.g.shape":"Shape and size","design.g.bg":"Background","design.glass":"Panel transparency","design.glassHint":"0 — solid, 100 — most transparent","design.blur":"Blur behind glass","design.blurHint":"How much the scene under panels is blurred","design.radius":"Corner rounding","design.radiusHint":"Corners of cards, buttons and panels","design.scale":"Interface scale","design.scaleHint":"Applied when you release the slider","design.scaleNarrow":"upscale needs 1280 px+","design.grid":"Hexagon grid","design.gridHint":"Background grid brightness","design.glow":"Glow","design.glowHint":"Colored background glow and vignette","design.preview":"Sample","design.previewHint":"Changes apply to the whole interface right away","design.reset":"Reset design","design.resetConfirm":"Restore the default Vyron design?","design.syncLocal":"Saved in this browser","design.syncSaving":"Saving to the printer…","design.syncOk":"Saved on the printer — shared by all screens","design.syncErr":"Could not save on the printer","state.klipperConfig":"Config error","state.klipperStartup":"Klipper starting…","state.klipperOffline":"Klipper not running","island.klipperConfig":"Error in printer config","island.klippyShow":"Show what happened","klippy.eb.shutdown":"Printer stopped","klippy.eb.error":"Printer failed to start","klippy.eb.startup":"Starting","klippy.eb.offline":"No connection to Klipper","klippy.startup.t":"Printer is starting…","klippy.startup.d":"Klipper is reading the config and connecting the boards. This usually takes a few seconds — nothing to do.","klippy.offline.t":"The printer control software is not running","klippy.offline.d":"The web interface is online, but Klipper — the program that actually drives the printer — is stopped or has crashed.","klippy.offline.h":`Press “Restart service” — that is usually enough
If it does not help, the reason will be in klippy.log
After a Klipper update a service restart is perfectly normal`,"klippy.check":"What to do","klippy.raw":"Technical details","klippy.copy":"Copy","klippy.copied":"Copied","klippy.fw":"Restart printer","klippy.restart":"Reload config","klippy.service":"Restart service","klippy.console":"Console","klippy.config":"Open config","klippy.hide":"Hide — click the status at the top to bring it back","klippy.restarting":"Restarting…","klippy.restarted":"Done — the printer is back","klippy.failed":"Command failed: {msg}","klippy.step.stop":"Stopping and resetting boards","klippy.step.start":"Starting and reading config","klippy.step.ready":"Printer ready","kerr.printStopped":"Print stopped","kerr.toConsole":"Console","kerr.close":"Close","kerr.cat.mcu":"Board connection","kerr.cat.heat":"Heating","kerr.cat.config":"Config","kerr.cat.motion":"Motion","kerr.cat.probe":"Bed probe","kerr.cat.driver":"Motor driver","kerr.cat.estop":"Emergency stop","kerr.cat.macro":"Macro","kerr.cat.generic":"Klipper","kerr.generic.d":"Klipper reported an error. Details are in the console.","kerr.estop.t":"Emergency stop triggered","kerr.estop.d":"The printer instantly cut the motors and heaters. This happens after pressing STOP or sending M112.","kerr.estop.h":`Make sure the cause is gone and the toolhead is not touching anything
Press “Restart printer” to bring it back
An interrupted print has to be started again`,"kerr.mcuLost.t":"Lost connection to board “{mcu}”","kerr.mcuLost.d":"A control board stopped responding, so the printer stopped for safety. Most often a cable or power is to blame.","kerr.mcuLost.h":`Check the board cable (USB or CAN) and the connectors at both ends — have they come loose?
Inspect the toolhead cable: it flexes constantly and can wear through
Make sure the board has power — usually an LED is lit on it
Then press “Restart printer”`,"kerr.mcuConnect.t":"Cannot connect to board “{mcu}”","kerr.mcuConnect.d":"Klipper could not find the board at startup. It may be off, not flashed, or the settings point to the wrong address.","kerr.mcuConnect.h":`Make sure the board is powered and the cable is connected
Check the board address in printer.cfg: serial for USB or canbus_uuid for CAN
For CAN: the can0 bus must be up (ip link show can0) and its speed must match on the host and in the board firmware
If the CAN bus was just built: each end needs a 120 Ω resistor — usually a jumper on the board`,"kerr.mcuProtocol.t":"Board “{mcu}” firmware is out of date","kerr.mcuProtocol.d":"The program on the board does not match the Klipper version on the printer’s computer. This almost always happens after a Klipper update.","kerr.mcuProtocol.h":`Reflash the board — build the firmware from the same Klipper version installed on the host
If there are several boards, update all of them`,"kerr.timer.t":"Board “{mcu}” fell behind","kerr.timer.d":"The board got a command too late or could not keep up, and stopped to avoid a bad move. Usually the printer’s computer is overloaded or the link is unstable.","kerr.timer.h":`Check CPU and memory load in the Engineering menu
Close extras on the host: a second web UI, a high-resolution camera
Check the board cable and whether the host is overheating
If it happens at high speeds, the board may not keep up: lower microsteps or speed
Then press “Restart printer”`,"kerr.heaterRate.t":"Heater “{heater}” is heating too slowly","kerr.heaterRate.d":"The temperature rose slower than expected, so the printer turned the heater off. This protects against overheating and fire.","kerr.heaterRate.h":`Check that the temperature sensor (thermistor) sits firmly in the heater block
Inspect the heater wires for breaks or loose contacts
If part cooling is very strong, lower it while heating
After the repair, run a PID calibration`,"kerr.adc.t":"Temperature out of allowed range","kerr.adc.d":"The sensor reported a temperature below the minimum or above the maximum in the config, so the printer turned heating off. Most often a sensor wire is broken or shorted; less often it is real overheating.","kerr.adc.h":`Inspect the thermistor wires for breaks, chafing or shorts
Check that the sensor connector is fully seated in the board
If you print at high temperatures, check that max_temp in printer.cfg is not too low
If the sensor was just replaced, check sensor_type in printer.cfg`,"kerr.tmc.t":"Problem with motor driver {drv}","kerr.tmc.d":"The board cannot talk to the driver that runs the motor, or the driver reported a fault. Moving without it is unsafe.","kerr.tmc.h":`Make sure motor power is on and the fuse is intact
Check the motor cable — a short in it causes this error too
Check that the driver is seated firmly on the board
If the driver is hot, check the electronics cooling`,"kerr.notHomed.t":"The axes need to be homed first","kerr.notHomed.d":"The printer does not know where the toolhead is, so it cannot move to coordinates.","kerr.notHomed.h":"Press Home (the house icon) on the motion panel — the printer will find the axis positions itself","kerr.range.t":"Point outside the build area","kerr.range.d":"The command asked to move past the edge of the bed, so the printer refused it. Nothing was damaged.","kerr.range.h":`If this happened during a print, check in the slicer that the model is fully on the bed
If you set a coordinate offset by hand (G92, SET_GCODE_OFFSET), reset it`,"kerr.cold.t":"The nozzle is not hot yet","kerr.cold.d":"Klipper does not feed plastic while the nozzle is below the threshold (170 °C by default): it would not melt and would jam. The command was skipped.","kerr.cold.h":"Heat the nozzle to the filament’s working temperature (PLA ~200 °C, PETG ~240 °C, ABS ~250 °C) and try again","kerr.extLong.t":"Too much filament in one go","kerr.extLong.d":"Klipper limits how much plastic one command can feed (50 mm by default), so a wrong command cannot push out too much.","kerr.extLong.h":`Feed the filament in several shorter steps
If a long feed is intentional, raise max_extrude_only_distance in printer.cfg`,"kerr.endstopStuck.t":"The {axis} endstop stays pressed","kerr.endstopStuck.d":"The axis moved away from the endstop, but it still reads as pressed. The switch may be stuck, the cable shorted, or the signal inverted in the config.","kerr.endstopStuck.h":`Check that the switch clicks freely and nothing presses on it
The QUERY_ENDSTOPS console command shows the endstop states
If the endstop always reads “pressed”, printer.cfg may need a “!” added or removed before the pin
For sensorless homing, lower the sensitivity (driver_SGTHRS)`,"kerr.endstop.t":"The {axis} endstop did not trigger","kerr.endstop.d":"While homing, the axis travelled its full length but the endstop switch never signalled, so the printer stopped moving.","kerr.endstop.h":`Check that the endstop cable is connected and undamaged
The QUERY_ENDSTOPS console command shows the endstop states
For sensorless homing, the sensitivity may need raising (driver_SGTHRS)`,"kerr.probePre.t":"The bed probe triggered too early","kerr.probePre.d":"The probe reported contact before it even started moving down: it is already touching the bed or giving a false signal.","kerr.probePre.h":`Make sure the nozzle and probe are not touching the bed and nothing is under them
Check the probe cable; QUERY_PROBE shows its state
For an Eddy probe, redo the calibration`,"kerr.probeNone.t":"The bed probe did not detect the bed","kerr.probeNone.d":"The toolhead went all the way down but the probe never triggered. The printer stopped so the nozzle would not hit the bed.","kerr.probeNone.h":`Check that the probe responds: QUERY_PROBE in the console shows its state
Check that the probe cable is connected and undamaged
If the probe works, Z may not be allowed to go low enough: check position_min in [stepper_z]`,"kerr.probeTol.t":"The bed probe measures inconsistently","kerr.probeTol.d":"Several measurements at the same point differ noticeably, so the result cannot be trusted.","kerr.probeTol.h":`Clean plastic residue off the nozzle and bed
Check that the probe is mounted firmly — play causes scatter
The PROBE_ACCURACY command shows the probe’s precision`,"kerr.leveling.t":"Could not level the gantry","kerr.leveling.d":"The printer tried to level the gantry several times, but the tilt never got within the required precision.","kerr.leveling.h":`If the gantry is badly skewed, level it by hand first
Check probe precision with PROBE_ACCURACY
If needed, raise the number of attempts (retries) in printer.cfg`,"kerr.config.t":"Error in printer config","kerr.config.d":"Klipper could not read printer.cfg, so the printer did not start. The technical details show exactly where the error is.","kerr.config.h":`Press “Open config” and find the section and option named in the technical details
Fix it, save the file and press “Reload config”`,"kerr.macro.t":"Error in macro {macro}","kerr.macro.d":"A macro is a set of commands stored in the printer settings. Something went wrong while it ran, so it did not finish.","kerr.macro.h":`Check that the macro received all the parameters it needs
If the macro was edited recently, the error is most likely in its text
Details are in the console`,"kerr.unknownCmd.t":"Unknown command {cmd}","kerr.unknownCmd.d":"There is no such command in Klipper or among your macros.","kerr.unknownCmd.h":`Check the spelling
Often it is a command from another firmware (e.g. G29 from Marlin) — replace it in the slicer’s start G-code with the Klipper equivalent or add a macro with that name`,"kerr.shutdownNow.t":"Printer stopped","kerr.shutdownNow.d":"After the previous error the printer ignores commands until it is restarted.","kerr.shutdownNow.h":"Press “Restart printer”","meta.notConnected":"Not connected","meta.noFile":"No active file","meta.gcodeError":"Could not load G-code: {msg}","meta.demo":"Demo · simulated print","print.controls":"Print controls","print.pause":"Pause","print.resume":"Resume","print.cancel":"Cancel","print.pausing":"Pausing…","print.resuming":"Resuming…","print.cancelling":"Cancelling…","print.cancelConfirm":"Cancel the current print? It cannot be resumed afterwards.","print.failed":"Could not do that — check the connection to the printer or look at the console","print.cancelOk":"Cancel print","print.keep":"Keep printing","status.nozzle":"Active nozzle","status.nozzleShort":"Nozzle","status.bed":"Bed","status.chamber":"Chamber","status.speed":"Speed","status.fan":"Fan","status.z":"Z height","status.layer":"Layer","status.qgl":"QGL","status.setNozzle":"Set nozzle temperature","status.setBed":"Set bed temperature","status.qglDone":"leveled","status.qglNot":"not leveled","status.ztilt":"Z-Tilt","qs.now":"Now","qs.target":"Target","qs.off":"Off","qs.exact":"Exact value…","qs.adjust":"Quick adjust: {name}","jog.title":"Motion","jog.step":"{a} step, mm","jog.position":"Current {a} position, mm","jog.levelRun":"Level gantry ({n})","jog.levelRunning":"{n} in progress…","jog.levelDone":"{n} done — run again","jog.levelFailed":"Leveling failed: {msg}","jog.home":"Home all axes","jog.motorsOff":"Disable motors (M84)","jog.motorsOffAria":"Disable motors","jog.badDistance":"Enter a valid distance greater than 0","jog.stepAll":"Move step","mob.data":"Data","mob.head":"Toolhead","mob.heads":"Toolheads","jog.homeAll":"Home","jog.motorsShort":"Motors","msg.demoNoExec":"Demo: com
